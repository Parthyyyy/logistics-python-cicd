name: Python CI Pipeline

# This tells GitHub to run this pipeline whenever code is pushed to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest # GitHub provides a free Linux server

    steps:
      # 1. Grab the code from the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install Python on the GitHub server
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip" # Enterprise best practice: Cache dependencies to speed up builds

      # 3. Install our app's dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run the exact same test command we ran locally!
      - name: Run Pytest
        run: |
          python -m pytest -v
  build-and-push:
    name: Build and Push Docker Image
    needs: test # ENTERPRISE BEST PRACTICE: Only runs if the 'test' job passes!
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/logistics-app:latest